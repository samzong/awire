name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  verify:
    name: Step 1 - release identity and changelog
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.1

      - name: Verify SemVer tag, package.json, and CHANGELOG.md
        id: meta
        run: node scripts/verify-release.mjs "$RUNNER_TEMP/release-notes.md"

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile
      - run: pnpm types
      - run: pnpm typecheck
      - run: pnpm test:config
      - run: pnpm test:delivery
      - run: pnpm test:webhook-filtering
      - run: pnpm check:openapi
      - run: pnpm deploy:dry

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IS_PRERELEASE: ${{ needs.verify.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          test -s "$notes"
          args=(--verify-tag --title "$RELEASE_TAG" --notes-file "$notes")
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}"
